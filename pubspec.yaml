name: laundry_flutter

description: "A Laundry Management System built with Flutter."

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at
# https://developer.android.com/studio/publish/versioning

# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/CoreFoundationKeys.html

# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.

version: 1.0.0+1

environment:
  sdk: ^3.13.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev.

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # Image picking
  # Used for selecting/capturing photos (e.g. laundry item photos,
  # proof-of-delivery images) from the gallery or camera.
  image_picker: ^1.1.2

  # Supabase — Storage (lib/core/services/file_service.dart) for
  # profile AND promo photos, since Firebase Storage now requires the
  # paid Blaze plan even at $0 usage (policy change, Feb 2026); PLUS
  # Supabase Database (Postgres, via PostgREST) for the `promos` table
  # itself (lib/data/datasources/promo_datasource.dart), per PART 20.
  # Firebase Auth/Firestore back every other collection unaffected.
  supabase_flutter: ^2.8.0

  # Client-side id generation for new promo rows (PART 20) — a promo's
  # id is needed up front, before the row is created, so its photo can
  # be uploaded to a Storage path keyed by that id in the same step
  # (see PromoDatasource.newPromoId). Pure-Dart, no native dependency.
  uuid: ^4.5.1

  # PART 19B — PDF generation and printing/export for Admin reports
  # and order receipts. `pdf` builds the document (pure Dart, no
  # platform channel); `printing` hands those bytes to the OS print
  # dialog / share sheet. Both are only ever touched by
  # lib/services/pdf_service.dart and lib/services/printing_service.dart
  # respectively — never imported directly by a screen.
  pdf: ^3.11.1
  printing: ^5.13.4

  # Typography — Plus Jakarta Sans (headings) + Inter (body) via
  # Google Fonts, used by lib/app/theme.dart. Fetched from Google's
  # CDN on first use and cached locally afterward.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Ships with the Flutter SDK (no pub.dev version to pin) — used for
  # the Part 05.4 end-to-end role-based-auth test, which needs to drive
  # a real running app against a real/emulated Firebase project rather
  # than mock widgets in isolation.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page:
# https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/laundry_hero.jpg
    - assets/images/quick_wash.png
    - assets/images/logo.png
    - assets/images/standard_wash.png
    - assets/images/premium_wash.png
    - assets/images/dry_cleaning.jpg
    - assets/images/wash_and_ironing.jpg
    - assets/images/service_bundle.jpg
    - assets/images/offers/first_order_discount.png
    - assets/images/offers/weekend_bundle.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key and a "fonts" key with a list giving the asset and other descriptors
  # for the font. For example:
  #
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see:
  # https://flutter.dev/to/font-from-package